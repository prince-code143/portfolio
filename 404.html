<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Poppins,system-ui,sans-serif;background:#0d2036;color:#fff;text-align:center;padding:20px}
h1{font-size:64px;margin:0;letter-spacing:-2px}h1 span{color:#2f9bf5}
p{color:#cfe0f0;margin:6px 0 22px}
a{display:inline-block;background:linear-gradient(135deg,#2f9bf5,#0d63b8);color:#fff;text-decoration:none;padding:11px 22px;border-radius:999px;font-weight:600}
</style>
</head>
<body>
<div><h1>4<span>0</span>4</h1><p>This page does not exist. It may have moved.</p><a id="home" href="./">Go to the home page</a></div>
<script>
/* find the site root for both user sites (/) and project sites (/repo/) */
var seg=location.pathname.split('/').filter(Boolean), link=document.getElementById('home');
link.href='/';
if(seg.length){fetch('/'+seg[0]+'/data/content.js',{method:'HEAD'}).then(function(r){if(r.ok)link.href='/'+seg[0]+'/'}).catch(function(){});}
</script>
</body>
</html>
