<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Site editor — Portfolio</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
<header class="bar">
  <button class="menu-t" id="menu-t" aria-label="Sections"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <div class="brand"><span class="ps">P<span>S</span></span><span><b>Site editor</b><i>Changes save as a draft on this device</i></span></div>
  <div class="state" id="state"><i class="dot"></i><span id="state-t">Everything is published</span></div>
  <button class="btn ghost" id="preview"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><span>Preview</span></button>
  <button class="btn pri" id="publish"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 16V4m-5 5 5-5 5 5M5 20h14"/></svg><span>Publish</span></button>
</header>

<div class="shell">
  <nav class="side" id="side" aria-label="Editor sections"></nav>
  <main class="main" id="main"></main>
</div>

<div class="modal" id="modal" hidden><div class="box" id="modal-box"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="data/content.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
